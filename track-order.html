<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track My Order | D&A Textiles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7f8;
            color: #333;
        }

        header {
            background: #8e2454;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }

        h2 {
            text-align: center;
            color: #8e2454;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #8e2454;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6f193f;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .status {
            color: #087b45;
            font-weight: bold;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>
    <header>
        <h1>D&A Textiles</h1>
        <p>Track Your Order</p>
    </header>

    <div class="container">
        <h2>Track My Order</h2>
        <p>Enter your Order ID to check your order status.</p>

        <input
            type="number"
            id="orderId"
            placeholder="Enter Order ID"
            min="1"
        >

        <button onclick="trackOrder()">Track Order</button>

        <div id="result" aria-live="polite"></div>
    </div>

    <script>
        async function trackOrder() {
            const id = document.getElementById("orderId").value.trim();
            const result = document.getElementById("result");

            if (!id || !Number.isInteger(Number(id)) || Number(id) < 1) {
                result.innerHTML =
                    '<p class="error">Please enter a valid Order ID.</p>';
                return;
            }

            result.textContent = "Checking your order...";

            try {
                const response = await fetch(
                    `https://nighty-shop-backend.onrender.com/api/orders/track/${encodeURIComponent(id)}`
                );

                if (response.status === 404) {
                    result.innerHTML =
                        '<p class="error">Order not found. Please check your Order ID.</p>';
                    return;
                }

                if (!response.ok) {
                    throw new Error("Unable to fetch order details.");
                }

                const order = await response.json();

                const status = document.createElement("p");
                status.append("Order Status: ");
                const statusValue = document.createElement("span");
                statusValue.className = "status";
                statusValue.textContent = order.status;
                status.append(statusValue);

                result.replaceChildren();

                const heading = document.createElement("h3");
                heading.textContent = "Order Details";
                result.append(heading);

                const orderNumber = document.createElement("p");
                orderNumber.textContent = `Order ID: ${order.id ?? order.orderId ?? id}`;
                result.append(orderNumber, status);

                const total = document.createElement("p");
                total.textContent =
                    `Total Amount: ₹${Number(order.total).toFixed(2)}`;
                result.append(total);

                const date = document.createElement("p");
                date.textContent =
                    `Order Date: ${new Date(order.orderDate).toLocaleString("en-IN")}`;
                result.append(date);

            } catch (error) {
                result.innerHTML =
                    '<p class="error">Unable to connect. Please make sure the backend is running.</p>';
            }
        }
    </script>
</body>
</html>
